name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
        working-directory: plugin
      - run: npm run check
        working-directory: plugin
      - run: npm test
        working-directory: plugin
      - run: git diff --exit-code -- main.js manifest.json styles.css
        working-directory: plugin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SetupCoding/obsidian-classic-notebook
          ref: 3.4.0
          path: obsidian-classic-notebook
      - run: npm run build
        working-directory: obsidian-classic-notebook
      - run: npm run test:integration
        working-directory: plugin
